<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rig Build Sheet — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101216;
    --panel: #191c22;
    --panel-2: #20242c;
    --line: #2b303a;
    --text: #edeef0;
    --muted: #868c98;
    --racing: #e8542a;
    --racing-dim: #4a2a1e;
    --flight: #4fb8e8;
    --flight-dim: #1e3a4a;
    --shared: #a78bfa;
    --shared-dim: #362f4a;
    --alt: #e8c547;
    --alt-dim: #4a3f1e;
    --accent: var(--racing);
    --accent-dim: var(--racing-dim);
    --good: #4fbf7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 26px);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    transition: background 0.4s ease;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- Header ---- */
  .masthead{ margin-bottom:16px; }
  .masthead h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.02em;
    font-size:clamp(28px,5vw,42px); margin:0; text-transform:uppercase; line-height:1;
  }
  .masthead .sub{ color:var(--muted); font-size:13px; letter-spacing:0.08em; text-transform:uppercase; margin-top:6px; }
  .masthead-controls{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:18px; }

  .tabs{ display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-wrap:wrap; }
  .tab{
    padding:10px 20px; cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase; font-size:14px; color:var(--muted);
    background:var(--panel); border:none; transition:all .2s ease; position:relative;
  }
  .tab.active{ color:#fff; background:var(--panel-2); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--accent); }
  .tab:not(.active):hover{ color:var(--text); }

  /* ribbon accent under tabs */
  .ribbon{ height:6px; margin:14px 0 22px; border-radius:3px; overflow:hidden; }
  .ribbon.racing{ background: repeating-linear-gradient(45deg, #1a1c20 0 10px, #e8e8e8 10px 20px); opacity:0.85; }
  .ribbon.flight{
    background: repeating-linear-gradient(90deg, var(--flight) 0 2px, transparent 2px 34px);
    opacity:0.65;
  }
  .ribbon.shared{ background: linear-gradient(90deg, var(--shared), transparent); opacity:0.8; }
  .ribbon.alternates{ background: repeating-linear-gradient(-45deg, var(--alt) 0 8px, transparent 8px 16px); opacity:0.55; }

  /* ---- Telemetry strip ---- */
  .telemetry{
    display:grid; grid-template-columns: repeat(2,1fr); gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:28px;
  }
  .gauge{ background:var(--panel); padding:16px 20px; }
  .gauge .label{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .gauge .value{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:var(--text); }
  .gauge .value.accent{ color:var(--accent); }
  .gauge .bar{ margin-top:10px; height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
  .gauge .bar-fill{ height:100%; background:var(--accent); transition: width .4s ease; }

  /* ---- Compare view ---- */
  .grand-total{
    display:grid; grid-template-columns:1fr; gap:1px; background:var(--line); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; margin-bottom:22px;
  }
  .grand-total .inner{ background:var(--panel); padding:20px 24px; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .grand-total .label{ font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:0.08em; font-size:14px; color:var(--muted); }
  .grand-total .value{ font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700; color:#fff; }
  .compare-cols{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .compare-col{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .compare-col .head{ padding:14px 16px; border-bottom:1px solid var(--line); }
  .compare-col .head .name{ font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; font-size:16px; }
  .compare-col .head .total{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; margin-top:4px; }
  .compare-col .head .count{ font-size:11.5px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.06em; }
  .compare-col .rows{ padding:6px 0; overflow-y:auto; max-height:420px; }
  .compare-row{ display:flex; justify-content:space-between; gap:10px; padding:8px 16px; font-size:13px; border-bottom:1px solid var(--line); }
  .compare-row:last-child{ border-bottom:none; }
  .compare-row .rname{ color:var(--text); }
  .compare-row .rcat{ display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:1px; }
  .compare-row .rprice{ font-family:'JetBrains Mono',monospace; font-weight:600; white-space:nowrap; }
  .compare-empty{ padding:20px 16px; color:var(--muted); font-size:13px; }
  @media (max-width:820px){ .compare-cols{ grid-template-columns:1fr; } }

  /* ---- Grid of parts ---- */
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; transition: border-color .2s ease, transform .15s ease;
  }
  .card:hover{ border-color: var(--accent); transform: translateY(-2px); }
  .card .img-wrap{
    aspect-ratio: 4/3; background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .card .img-wrap img{ width:100%; height:100%; object-fit:cover; }
  .card .img-wrap .ph{ color:var(--muted); font-size:12px; text-align:center; padding:10px; }
  .card .cat{
    position:absolute; top:8px; left:8px; background:rgba(16,18,22,0.85); color:var(--accent);
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; border:1px solid var(--line);
  }
  .card .rig-badge{
    position:absolute; top:8px; right:8px; background:rgba(16,18,22,0.85);
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; border:1px solid var(--line);
  }
  .btn.swap{ width:100%; justify-content:center; background:var(--alt-dim); color:var(--alt); border-color:var(--alt); font-weight:700; }
  .btn.swap:hover{ background:var(--alt); color:#1a1608; }
  .card .actions.two-row{ flex-direction:column; gap:8px; }
  .card .actions.two-row .sub-row{ display:flex; gap:8px; }
  .card .body{ padding:14px 14px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card .name{ font-weight:600; font-size:15px; line-height:1.3; }
  .card .price{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent); }
  .card .actions{ margin-top:auto; display:flex; gap:8px; padding-top:8px; }
  .btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:7px 10px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:5px; transition: all .15s ease;
  }
  .btn:hover{ background:var(--line); }
  .btn.link{ color:var(--accent); border-color: var(--accent-dim); flex:1; justify-content:center; }
  .btn.icon{ padding:7px 9px; }
  .btn.danger:hover{ color:#e8542a; border-color:#e8542a; }

  .card.add-card{
    border-style:dashed; align-items:center; justify-content:center; cursor:pointer; min-height:220px;
    color:var(--muted); background:transparent;
  }
  .card.add-card:hover{ color:var(--accent); border-color:var(--accent); }
  .card.add-card .plus{ font-size:34px; line-height:1; margin-bottom:6px; font-weight:300; }
  .card.add-card .txt{ font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; font-size:13px; }

  .empty-hint{ color:var(--muted); font-size:13px; margin:-6px 0 18px; }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,9,11,0.7); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:440px;
    padding:22px; max-height:88vh; overflow:auto;
  }
  .modal h2{ font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:20px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-family:'Inter',sans-serif; font-size:14px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .combo{ position:relative; }
  .combo-list{
    display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:40;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    max-height:160px; overflow-y:auto; box-shadow:0 8px 20px rgba(0,0,0,0.45);
  }
  .combo-list.show{ display:block; }
  .combo-list .opt{
    padding:8px 10px; font-size:13.5px; color:var(--text); cursor:pointer;
  }
  .combo-list .opt:hover{ background:var(--line); color:var(--accent); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .link-row{ display:flex; gap:8px; }
  .link-row input{ flex:1; }
  .link-row .btn{ white-space:nowrap; padding:9px 12px; font-size:12.5px; }
  .link-row .btn:disabled{ opacity:0.6; cursor:default; }
  .fetch-msg{ font-size:12.5px; padding:2px 2px 0; }
  .fetch-msg.ok{ color:var(--good); }
  .fetch-msg.fail{ color:var(--muted); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; justify-content:center; padding:10px; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#101216; font-weight:700; }
  .btn.primary:hover{ filter:brightness(1.08); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--panel-2); border:1px solid var(--line); padding:10px 18px; border-radius:9px;
    font-size:13px; transition:all .25s ease; pointer-events:none; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .publish-box{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .publish-box .btn.primary{ background:var(--good); border-color:var(--good); }
  .publish-meta{ font-size:11px; color:var(--muted); }
  .publish-meta button{
    background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer;
    font-size:11px; padding:0; font-family:'Inter',sans-serif;
  }

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .telemetry{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Rig Build Sheet</h1>
      <div class="sub" id="subtitle">Racing simulator — parts &amp; pricing log</div>
    </div>
  </div>
  <div class="masthead-controls">
    <div class="tabs">
      <button class="tab active" data-rig="racing" id="tab-racing">Racing Rig</button>
      <button class="tab" data-rig="flight" id="tab-flight">Flight Rig</button>
      <button class="tab" data-rig="shared" id="tab-shared">Shared Peripherals</button>
      <button class="tab" id="tab-alternates">Alternates</button>
      <button class="tab" id="tab-fullbuild">Full Build</button>
    </div>
    <div class="publish-box">
      <button class="btn primary" id="publish-btn">⬆ Publish</button>
      <div class="publish-meta" id="publish-meta"></div>
    </div>
  </div>

  <div class="ribbon racing" id="ribbon"></div>

  <div id="rig-view">
    <div class="telemetry">
      <div class="gauge">
        <div class="label">Total logged</div>
        <div class="value accent" id="stat-total">$0</div>
      </div>
      <div class="gauge">
        <div class="label">Parts</div>
        <div class="value" id="stat-count">0</div>
      </div>
    </div>

    <div id="empty-hint" class="empty-hint" style="display:none;">No parts logged yet for this rig — add your first one below.</div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="alternates-view" style="display:none;"></div>

  <div id="fullbuild-view" style="display:none;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Add Part</h2>
    <div class="field" id="alt-rig-field" style="display:none;">
      <label>For rig</label>
      <select id="f-altrig">
        <option value="racing">Racing Rig</option>
        <option value="flight">Flight Rig</option>
        <option value="shared">Shared Peripherals</option>
      </select>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="combo">
        <input id="f-category" placeholder="e.g. Wheel Base" autocomplete="off">
        <div class="combo-list" id="cat-combo-list"></div>
      </div>
    </div>
    <div class="field">
      <label>Part name</label>
      <input id="f-name" placeholder="e.g. Fanatec CSL DD">
    </div>
    <div class="field">
      <label>Image URL</label>
      <input id="f-image" placeholder="https://...">
    </div>
    <div class="field">
      <label>Store link</label>
      <div class="link-row">
        <input id="f-link" placeholder="https://...">
        <button class="btn icon" id="fetch-price-btn" type="button" title="Reads the product page's own listing data for price, name, and image — no API key needed, works best on manufacturer/retailer sites">↺ Find price &amp; image</button>
      </div>
    </div>
    <div class="field" id="fetch-status" style="display:none;"></div>
    <div class="field">
      <label>Price (USD)</label>
      <input id="f-price" type="number" step="0.01" placeholder="599.99">
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancel-btn">Cancel</button>
      <button class="btn primary" id="save-btn">Save Part</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const THEME = {
  racing: { accent:"#e8542a", dim:"#4a2a1e", label:"Racing simulator — parts & pricing log", name:"Racing Rig" },
  flight: { accent:"#4fb8e8", dim:"#1e3a4a", label:"Flight simulator — parts & pricing log", name:"Flight Rig" },
  shared: { accent:"#a78bfa", dim:"#362f4a", label:"Shared peripherals — used by both rigs", name:"Shared Peripherals" },
  alternates: { accent:"#e8c547", dim:"#4a3f1e", label:"Dream upgrades & budget swaps — ready to slot in", name:"Alternates" }
};
const RIG_ORDER = ["racing","flight","shared"];

// window.storage only exists inside the Claude.ai artifact runtime. Once this file is
// downloaded and opened locally (origin 'null'), it isn't reachable — detect that here
// so parts storage can fall back to the browser's own localStorage instead.
const IS_ARTIFACT_ENV = (typeof window.storage !== 'undefined' && window.storage !== null);
const LOCAL_STORAGE_KEY = 'sim-rig-parts';

// Publish target — the public repo/branch the viewer (index.html) reads data.json from.
const GITHUB_OWNER = 'nlucaccioni';
const GITHUB_REPO = 'rig-build-sheet';
const GITHUB_BRANCH = 'main';
const DATA_PATH = 'data.json';
const GITHUB_TOKEN_KEY = 'rig-github-token';
const LAST_PUBLISHED_KEY = 'rig-last-published';

let parts = [];
let activeRig = "racing";
let editingId = null;
let currentView = "rig"; // 'rig' | 'alternates' | 'fullbuild'
let modalIsAlternate = false;

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }

function money(n){
  return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

async function fetchPublishedParts(){
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${DATA_PATH}?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

async function loadParts(){
  try{
    if(IS_ARTIFACT_ENV){
      const res = await window.storage.get('sim-rig-parts', false);
      parts = res && res.value ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if(raw !== null){
        parts = JSON.parse(raw);
      } else {
        // Nothing saved yet in this browser (e.g. first time opening edit.html on a new
        // device, or via the GitHub Pages URL instead of the local file) — localStorage is
        // scoped per-origin, so it won't carry over from elsewhere. Bootstrap from the last
        // published build instead of starting blank.
        const published = await fetchPublishedParts();
        parts = published || [];
        if(published){
          await saveParts();
          showToast('Loaded the last published build');
        }
      }
    }
  }catch(e){
    parts = [];
  }
  render();
}

async function saveParts(){
  try{
    if(IS_ARTIFACT_ENV){
      await window.storage.set('sim-rig-parts', JSON.stringify(parts), false);
    } else {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(parts));
    }
  }catch(e){
    showToast('Could not save — try again');
  }
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
}

function getGithubToken(){
  let token = localStorage.getItem(GITHUB_TOKEN_KEY);
  if(!token){
    token = (prompt('Paste your GitHub personal access token (fine-grained, scoped to this repo, Contents: Read and write). It is saved only in this browser.') || '').trim();
    if(token) localStorage.setItem(GITHUB_TOKEN_KEY, token);
  }
  return token || null;
}

function changeGithubToken(){
  const token = (prompt('Enter a new GitHub personal access token:') || '').trim();
  if(token){
    localStorage.setItem(GITHUB_TOKEN_KEY, token);
    showToast('Token updated');
  }
}

function renderPublishMeta(){
  const el = document.getElementById('publish-meta');
  const last = localStorage.getItem(LAST_PUBLISHED_KEY);
  el.innerHTML = (last ? `Last published: ${escapeHtml(last)}` : 'Never published') +
    ` &middot; <button type="button" id="change-token-btn">change token</button>`;
  document.getElementById('change-token-btn').onclick = changeGithubToken;
}

async function publishBuild(){
  const token = getGithubToken();
  if(!token) return;

  const btn = document.getElementById('publish-btn');
  const original = btn.textContent;
  btn.textContent = 'Publishing…';
  btn.disabled = true;

  const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json'
  };

  try{
    // GitHub's API responses can be cached by the browser (Cache-Control: private, max-age=60),
    // which would hand back a stale sha here and cause a 409 on the PUT below — force a fresh read.
    async function currentSha(){
      const res = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}`, { headers, cache: 'no-store' });
      if(res.ok) return (await res.json()).sha;
      if(res.status === 404) return undefined;
      throw new Error('lookup-failed:' + res.status);
    }

    async function attemptPublish(sha){
      return fetch(apiUrl, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Publish build data',
          content: b64EncodeUnicode(JSON.stringify(parts, null, 2)),
          branch: GITHUB_BRANCH,
          ...(sha ? { sha } : {})
        })
      });
    }

    let putRes = await attemptPublish(await currentSha());

    // A 409 means our sha was stale (someone/something else touched the file in between) —
    // re-read the true current sha and retry exactly once before surfacing an error.
    if(putRes.status === 409){
      putRes = await attemptPublish(await currentSha());
    }

    if(!putRes.ok){
      if(putRes.status === 401){
        localStorage.removeItem(GITHUB_TOKEN_KEY);
        showToast('Token rejected — removed, please re-enter and try again');
      } else if(putRes.status === 403){
        showToast('Token lacks permission to write to this repo');
      } else if(putRes.status === 409){
        showToast('Publish conflict — try again');
      } else {
        showToast('Publish failed (' + putRes.status + ') — try again');
      }
      btn.textContent = original;
      btn.disabled = false;
      return;
    }

    localStorage.setItem(LAST_PUBLISHED_KEY, new Date().toLocaleString());
    renderPublishMeta();
    showToast('Published — the shared link is now up to date');
  }catch(e){
    showToast('Could not reach GitHub — check your connection and try again');
  }
  btn.textContent = original;
  btn.disabled = false;
}

}

function renderFullBuild(){
  const fb = document.getElementById('fullbuild-view');
  const activeParts = parts.filter(p=>p.active!==false);
  const grand = activeParts.reduce((s,p)=>s+Number(p.price||0),0);

  const cols = RIG_ORDER.map(rig=>{
    const list = activeParts.filter(p=>p.rig===rig);
    const total = list.reduce((s,p)=>s+Number(p.price||0),0);
    const rows = list.length
      ? list.map(p=>`
          <div class="compare-row">
            <span class="rname">${escapeHtml(p.name || 'Untitled part')}<span class="rcat">${escapeHtml(p.category||'Part')}</span></span>
            <span class="rprice">${money(p.price)}</span>
          </div>`).join('')
      : `<div class="compare-empty">Nothing logged yet.</div>`;
    return `
      <div class="compare-col">
        <div class="head" style="border-color:${THEME[rig].dim};">
          <div class="name" style="color:${THEME[rig].accent};">${THEME[rig].name}</div>
          <div class="total">${money(total)}</div>
          <div class="count">${list.length} part${list.length===1?'':'s'}</div>
        </div>
        <div class="rows">${rows}</div>
      </div>`;
  }).join('');

  fb.innerHTML = `
    <div class="grand-total">
      <div class="inner">
        <span class="label">Grand total — full build (alternates not included)</span>
        <span class="value">${money(grand)}</span>
      </div>
    </div>
    <div class="compare-cols">${cols}</div>
  `;
}

function partsForRig(){ return parts.filter(p => p.rig === activeRig && p.active !== false); }

      <div class="img-wrap">

        <div class="cat">${escapeHtml(p.category || 'Part')}</div>

        <div class="name">${escapeHtml(p.name || 'Untitled part')}</div>
        <div class="price">${money(p.price)}</div>
        <div class="actions">
          ${p.link ? `<a class="btn link" href="${escapeAttr(p.link)}" target="_blank" rel="noopener">Store page ↗</a>` : `<span class="btn link" style="opacity:.4;cursor:default;">No link</span>`}

function renderAlternates(){

  const header = `
    <div class="empty-hint" style="margin-bottom:16px;">
      ${list.length ? `${list.length} alternate${list.length===1?'':'s'} on file — swap one in to replace what's currently active in that rig &amp; category.` : "No alternates yet — log a dream upgrade or a cheaper option below, then swap it into a rig whenever you're ready."}
    </div>
    <div class="grid" id="alt-grid"></div>
  `;
  av.innerHTML = header;
  const altGrid = document.getElementById('alt-grid');

  list.forEach(p=>{
    const rigTheme = THEME[p.rig] || THEME.racing;
    const card = document.createElement('div');
    card.className = 'card';
    const imgHtml = p.image
      ? `<img src="${escapeAttr(p.image)}" onerror="this.parentElement.innerHTML='<div class=&quot;ph&quot;>Image unavailable</div>'" alt="${escapeAttr(p.name)}">`
      : `<div class="ph">No image</div>`;
    card.innerHTML = `
      <div class="img-wrap">
        ${imgHtml}
        <div class="cat">${escapeHtml(p.category || 'Part')}</div>
        <div class="rig-badge" style="color:${rigTheme.accent};">${escapeHtml(rigTheme.name)}</div>
      </div>

        <div class="price">${money(p.price)}</div>

          <button class="btn swap" title="Make this the active part in its rig &amp; category" onclick="swapAlternateIn('${p.id}')">⇄ Swap into rig</button>

            ${p.link ? `<a class="btn link" href="${escapeAttr(p.link)}" target="_blank" rel="noopener">Store page ↗</a>` : `<span class="btn link" style="opacity:.4;cursor:default;">No link</span>`}
            <button class="btn icon" title="Edit" onclick="openEditAlternate('${p.id}')">✎</button>
            <button class="btn icon danger" title="Remove" onclick="removePart('${p.id}')">✕</button>

        </div>
      </div>

    altGrid.appendChild(card);
  });

  const addCard = document.createElement('div');
  addCard.className = 'card add-card';

function swapAlternateIn(id){
  const alt = parts.find(p=>p.id===id);
  if(!alt) return;
  const cat = (alt.category||'').trim().toLowerCase();
  const match = parts.find(p => p.id!==alt.id && p.rig===alt.rig && p.active!==false && (p.category||'').trim().toLowerCase()===cat);
  alt.active = true;
  if(match){
    match.active = false;
    showToast(`Swapped in ${alt.name} for ${match.name}`);
  } else {
    showToast(`${alt.name} added to ${THEME[alt.rig].name}`);
  }
  saveParts();
  renderAlternates();
}

function demoteToAlternate(id){
  const p = parts.find(x=>x.id===id);
  if(!p) return;
  p.active = false;
  saveParts();
  render();
  showToast(`${p.name} moved to Alternates`);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

let categorySuggestions = [];

function populateDatalist(rig){
  // Only categories actually in use for this rig — no static suggestion list — so the
  // dropdown always reflects real "slots" and picking one reuses the exact existing string
  // (keeping rig+category consistent for the Alternates swap match).
  const used = parts.filter(p=>p.rig===rig).map(p=>p.category).filter(Boolean);
  const seen = new Set();
  categorySuggestions = [];
  used.forEach(c=>{
    const key = c.trim().toLowerCase();
    if(!key || seen.has(key)) return;
    seen.add(key);
    categorySuggestions.push(c);
  });
  renderCategoryOptions();
}

function renderCategoryOptions(){
  const input = document.getElementById('f-category');
  const list = document.getElementById('cat-combo-list');
  const q = input.value.trim().toLowerCase();
  const matches = categorySuggestions.filter(c => c.toLowerCase().includes(q));
  list.innerHTML = matches.map(c => `<div class="opt" data-value="${escapeAttr(c)}">${escapeHtml(c)}</div>`).join('');
  list.querySelectorAll('.opt').forEach(el=>{
    el.onmousedown = (e)=>{ // mousedown fires before the input's blur, unlike click
      e.preventDefault();
      input.value = el.dataset.value;
      hideCategoryOptions();
    };
  });
  list.classList.toggle('show', matches.length > 0);
}

function hideCategoryOptions(){
  document.getElementById('cat-combo-list').classList.remove('show');
}

function closeModal(){ overlay.classList.remove('show'); }

async function savePart(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ showToast('Give the part a name'); return; }
  const data = {
    category: document.getElementById('f-category').value.trim() || 'Part',
    name,
    image: document.getElementById('f-image').value.trim(),
    price: parseFloat(document.getElementById('f-price').value) || 0,
    link: document.getElementById('f-link').value.trim(),
  };
  if(modalIsAlternate){
    data.rig = document.getElementById('f-altrig').value;
    data.active = false;
  } else {
    data.rig = activeRig;
    data.active = true;
  }
  if(editingId){
    const idx = parts.findIndex(p=>p.id===editingId);
    if(idx>-1) parts[idx] = {...parts[idx], ...data};
    showToast(modalIsAlternate ? 'Alternate updated' : 'Part updated');
  }else{
    parts.push({ id: uid(), ...data });
    showToast(modalIsAlternate ? 'Alternate added' : 'Part added');
  }
  await saveParts();
  closeModal();
  if(modalIsAlternate){ renderAlternates(); } else { render(); }
}

async function removePart(id){
  parts = parts.filter(p=>p.id!==id);
  await saveParts();
  if(currentView === 'alternates'){ renderAlternates(); } else { render(); }
  showToast('Part removed');
}

function setFetchStatus(msg, kind){
  const el = document.getElementById('fetch-status');
  if(!msg){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = `<div class="fetch-msg ${kind}">${escapeHtml(msg)}</div>`;
}


function absUrl(u, base){
  try{ return new URL(u, base).href; }catch(e){ return u; }
}

function fetchWithTimeout(url, opts, ms){
  return Promise.race([
    fetch(url, opts),
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

// Public, keyless relay services that fetch a page's HTML on our behalf — needed because
// browsers block a page from directly reading another site's HTML (CORS). These are free
// third-party services, not run by Anthropic, so we chain a few and treat any/all of them
// failing as a normal, expected outcome.
const CORS_PROXIES = [
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];

async function fetchPageHtml(url){
  for(const makeProxyUrl of CORS_PROXIES){
    try{
      const res = await fetchWithTimeout(makeProxyUrl(url), {}, 9000);
      if(res.ok){
        const html = await res.text();
        if(html && html.length > 200) return html;
      }
    }catch(e){ /* this proxy failed or timed out — try the next one */ }
  }
  return null;
}

function parseProductFromHtml(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let name = null, image = null, price = null;

  // 1. schema.org JSON-LD — the most reliable source, meant for search engines to read.
  const ldScripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for(const script of ldScripts){
    try{
      const data = JSON.parse(script.textContent);
      const candidates = Array.isArray(data) ? data : (data['@graph'] || [data]);
      for(const item of candidates){
        if(!item) continue;
        const type = item['@type'];
        const isProduct = type === 'Product' || (Array.isArray(type) && type.includes('Product'));
        if(!isProduct) continue;
        name = name || item.name || null;
        let img = item.image;
        if(Array.isArray(img)) img = img[0];
        if(img && typeof img === 'object') img = img.url;
        image = image || img || null;
        let offers = item.offers;
        if(Array.isArray(offers)) offers = offers[0];
        if(offers) price = price || offers.price || offers.lowPrice || null;
      }
    }catch(e){ /* malformed JSON-LD block — skip it */ }
  }

  // 2. Open Graph / Twitter meta tags — fallback for image and name.
  if(!image){
    image = doc.querySelector('meta[property="og:image"]')?.getAttribute('content')
      || doc.querySelector('meta[property="og:image:secure_url"]')?.getAttribute('content')
      || doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content')
      || null;
  }
  if(!name){
    name = doc.querySelector('meta[property="og:title"]')?.getAttribute('content')
      || doc.querySelector('title')?.textContent
      || null;
  }
  if(!price){
    const metaPrice = doc.querySelector('meta[property="og:price:amount"]')?.getAttribute('content')
      || doc.querySelector('meta[property="product:price:amount"]')?.getAttribute('content')
      || doc.querySelector('[itemprop="price"]')?.getAttribute('content')
      || doc.querySelector('[itemprop="price"]')?.textContent
      || null;
    if(metaPrice) price = metaPrice;
  }

  if(image) image = absUrl(image, baseUrl);
  if(price){
    const num = parseFloat(String(price).replace(/[^0-9.]/g, ''));
    price = isNaN(num) ? null : num;
  }
  if(name) name = name.trim().replace(/\s+/g, ' ').slice(0, 200);

  return { name, image, price };
}

async function fetchDetails(){
  const link = document.getElementById('f-link').value.trim();
  if(!link){ showToast('Add a store link first'); return; }

  const btn = document.getElementById('fetch-price-btn');
  const original = btn.textContent;
  btn.textContent = 'Reading page…';
  btn.disabled = true;
  setFetchStatus('Reading the product page…', 'fail');

  try{
    const html = await fetchPageHtml(link);
    if(!html){
      setFetchStatus("Couldn't reach that page (it may block automated access) — enter details manually.", 'fail');
      btn.textContent = original;
      btn.disabled = false;
      return;
    }

    const result = parseProductFromHtml(html, link);
    let found = [];
    if(result.price){
      document.getElementById('f-price').value = result.price.toFixed(2);
      found.push('price');
    }
    if(result.image){
      document.getElementById('f-image').value = result.image;
      found.push('image');
    }
    if(result.name && !document.getElementById('f-name').value.trim()){
      document.getElementById('f-name').value = result.name;
    }

    if(found.length){
      setFetchStatus(`Found ${found.join(' & ')} on the page — double-check before saving.`, 'ok');
    } else {
      setFetchStatus("Page loaded, but didn't contain readable product data — enter details manually.", 'fail');
    }
  }catch(e){
    setFetchStatus("Something went wrong reading that page — enter details manually.", 'fail');
  }
  btn.textContent = original;
  btn.disabled = false;
}
